<!doctype html>
<html lang="zh-CN" data-default-state="login">
<head>
<meta charset="utf-8">
<title>登录 / 解锁 / 待审核</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .auth { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 48px 48px 28px; }
  .auth .form { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
  .auth h1 { margin: 16px 0 4px; font-size: var(--text-xl); font-weight: 600; }
  .links { display: flex; justify-content: center; gap: 16px; margin-top: 4px; font-size: var(--text-xs); }
  .links a { color: var(--brand-700); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .trust { display: flex; align-items: center; gap: 6px; margin-top: auto; color: var(--ink-500); font-size: var(--text-xs); }
  .err { color: var(--danger-700); font-size: var(--text-xs); }
</style>
</head>
<body>
<!--
  登录窗口 440×600（未登录或需要解锁时，主窗口尺寸缩小为此卡片窗口）。状态：
    login    邮箱 + 密码；注册 / 忘记密码在网页完成（外链图标）
    working  点击登录后：按钮显示进度文字“正在验证…”（Argon2 派生约 1–2 秒），输入框禁用
    error    密码错误（与“账号不存在”同一提示，不区分）
    unlock   已登录过：显示邮箱，只需输入密码；“切换账号”回到登录
    pending  待审核账号：说明 + 退出登录，没有任何上传入口
-->
<div class="window capture" style="width:440px;height:600px">
  <div class="titlebar" data-partial="titlebar" data-title=""></div>

  <div class="auth" data-when="login working error">
    <span class="logo" style="--s:48px;--s-inner:26px"><i data-icon="lock"></i></span>
    <h1>登录加密备份</h1>
    <span class="muted">文件在这台电脑上加密后才上传</span>
    <div class="form">
      <div class="field"><label>邮箱</label><div class="input"><span>tlj978626571@gmail.com</span></div></div>
      <div class="field"><label>密码</label>
        <span data-when="login"><div class="input focus"><span>••••••••••••</span></div></span>
        <span data-when="working"><div class="input" style="background:var(--canvas)"><span class="muted">••••••••••••</span></div></span>
        <span data-when="error"><div class="input" style="border-color:var(--danger-600)"><span>••••••••</span></div></span>
        <span data-when="error" class="err">邮箱或密码不正确</span>
      </div>
      <span data-when="login error"><button class="btn btn-primary btn-lg btn-block">登录</button></span>
      <span data-when="working"><button class="btn btn-primary btn-lg btn-block" style="opacity:.8">正在验证…</button></span>
      <div class="links"><a>注册账号<i data-icon="external" style="--s:12px"></i></a><a>忘记密码<i data-icon="external" style="--s:12px"></i></a></div>
    </div>
    <div class="trust"><i data-icon="shield-check" style="--s:14px"></i>服务器无法看到你的密码和文件内容</div>
  </div>

  <div class="auth" data-when="unlock">
    <span class="avatar" style="--s:56px">T</span>
    <h1>欢迎回来</h1>
    <span class="muted">tlj978626571@gmail.com</span>
    <div class="form">
      <div class="field"><label>密码</label><div class="input focus"><span>••••••••••••</span></div></div>
      <button class="btn btn-primary btn-lg btn-block"><i data-icon="lock"></i>解锁</button>
      <div class="links"><a>切换账号</a><a>忘记密码<i data-icon="external" style="--s:12px"></i></a></div>
    </div>
    <div class="trust"><i data-icon="info" style="--s:14px"></i>解锁后备份会自动继续</div>
  </div>

  <div class="auth" data-when="pending" style="text-align:center">
    <span class="logo" style="--s:56px;--s-inner:28px;background:var(--warning-50);color:var(--warning-600)"><i data-icon="hourglass"></i></span>
    <h1>正在等待管理员审核</h1>
    <span class="muted" style="max-width:300px">账号通过审核后即可上传和备份文件。审核结果会发送到 tlj978626571@gmail.com。</span>
    <div class="form" style="margin-top:32px">
      <button class="btn btn-lg btn-block"><i data-icon="refresh"></i>重新检查</button>
      <button class="btn btn-ghost btn-block">退出登录</button>
    </div>
  </div>
</div>
<script src="shared.js"></script>
</body>
</html>
