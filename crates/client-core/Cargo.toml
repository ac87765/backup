[package]
name = "client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "原生客户端核心：认证、密钥边界与凭据存储（与 Flutter 界面分离）"

# 依赖理由（AGENTS.md 要求逐个说明）：
# - crypto-core：唯一加密实现；复用 KDF/HKDF/AEAD 与 KDF 参数校验，保证与 Web 完全一致。
# - reqwest：HTTP 客户端。default-features = false，只启用 rustls-tls（webpki roots）
#   且该特性显式选择 ring 提供者；不启用 cookies 特性，会话 Cookie 由本 crate 自己管理。
# - serde / serde_json：API 请求/响应与 KDF 参数 JSON 契约。
# - thiserror：强类型领域错误。
# - tokio：异步等待（429 退避）与 spawn_blocking（Argon2id 不阻塞异步运行时）。
# - tracing：结构化日志；只记录方法/路径/状态码，绝不记录请求体、令牌或密钥。
# - zeroize：会话令牌等敏感缓冲区离开作用域时清零。
# - getrandom：退避抖动使用操作系统 CSPRNG（AGENTS.md 禁止 Math.random 类随机源）。
# - uuid：解析服务端返回的用户/根节点 ID，保证公开 API 是强类型展示数据。
# - rusqlite（bundled）：design D5 指定的本地状态库。bundled 让 Windows/macOS
#   安装包不依赖系统 SQLite，行为在 CI 与用户机器上一致。
# - unicode-normalization：文件夹合并时必须按 NFC + 小写比较名称，与
#   crypto-core 的名称令牌规则保持一致；这是 crypto-core 已使用的同一依赖。
# - subtle：文件夹增量判定会比较明文内容 SHA-256，AGENTS.md 要求哈希比较为
#   常量时间；crypto-core 内部使用的同一常量时间实现。
# - notify（desktop feature）：design D6 指定的跨平台文件系统监听（Windows
#   ReadDirectoryChangesW / macOS FSEvents / Linux inotify）。CC0-1.0，已在
#   deny.toml 允许列表中；只在 desktop feature 下编译，iOS 构建不引入。
# - globset（desktop feature）：用户排除规则的成熟 glob 实现（ripgrep 的
#   glob 引擎），Unlicense OR MIT，已在 deny.toml 允许列表中。自己写 glob
#   容易出现转义/字符类/分隔符语义偏差，因此使用该库。
# - axum / http-body-util（dev）：429 退避测试的本地假服务器。
# - sqlx / testcontainers / tempfile（dev）：参照 server 集成测试，启动 PostgreSQL + MinIO。
# - server（dev）：进程内启动真实服务端路由，验证客户端与真实实现互通。
# - tower（dev）：假服务器与测试工具复用 axum 生态。
[dependencies]
crypto-core = { version = "0.1.0", path = "../crypto-core" }
getrandom = "0.2"
# desktop feature 专用依赖（理由见文件头注释）。
globset = { version = "0.4", optional = true }
notify = { version = "6.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
tracing = "0.1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["derive"] }

# 密钥链（design D3）：
# - macOS：security-framework 的 generic password + SecAccessControl
#   （保护级别映射到 kSecAttrAccessibleWhenUnlockedThisDeviceOnly）。
# - Windows：直接用 windows-sys 调 DPAPI（CryptProtectData，当前用户范围）加密，
#   再用 Credential Manager（CredWriteW/CredReadW）保存。没有引入 keyring：
#   直连 Win32 API 的依赖更少、行为更明确，且 windows-sys 已是项目依赖。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# windows-sys 新增 feature（add-wechat-backup 第 1 组，不新增 crate）：
# - Win32_System_Registry：读取 HKCU\Software\Tencent\WeChat 的 FileSavePath；
# - Win32_UI_Shell：SHGetKnownFolderPath + FOLDERID_Documents（“文档”目录，
#   不硬编码 C:\Users\…）；
# - Win32_System_Com：CoTaskMemFree 释放 Known Folder API 分配的路径。
#
# 第 3 组新增 Win32_System_Diagnostics_ToolHelp（同一 crate，仅加 feature）：
# 用 CreateToolhelp32Snapshot / Process32FirstW / Process32NextW 枚举进程名，
# 判断 WeChat.exe / Weixin.exe / WeChatAppEx.exe 是否存在。相比 WMI 或新增
# sysinfo 类依赖，ToolHelp 是只读的内核快照 API，不需要额外 crate，也不读取
# 进程内存或命令行。
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1"
server = { version = "0.1.0", path = "../server" }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "json",
    "time",
    "uuid",
] }
tempfile = "3"
testcontainers = "0.28"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "time",
    "sync",
] }
tower = { version = "0.5", features = ["util"] }

# 这三个集成测试直接使用 `client_core::desktop`；必须声明 required-features，
# 否则 `cargo test -p client-core`（未启用 desktop）会因为缺少模块而编译失败。
# 工作区构建由 `client-core-desktop-tests` 统一启用 desktop，仍会编译并运行它们。
[[test]]
name = "backup"
path = "tests/backup.rs"
required-features = ["desktop"]

[[test]]
name = "backup_fake"
path = "tests/backup_fake.rs"
required-features = ["desktop"]

# 真实 PostgreSQL + MinIO 的数据库快照逐字节一致性测试（审查者在 WSL 运行）。
[[test]]
name = "wechat_snapshot"
path = "tests/wechat_snapshot.rs"
required-features = ["desktop"]

[features]
# 桌面专有能力的入口（文件监听、备份调度等）。默认关闭，iOS 构建不启用，
# 因此不会编译 notify / globset 与桌面备份模块。
# 为了让 CI 的 `cargo test --workspace` / `cargo clippy --workspace --all-targets`
# 覆盖备份引擎，工作区增加了只含测试的 `client-core-desktop-tests` crate，
# 它把 client-core 作为启用了 desktop 的 dev-dependency 引入；Cargo 在一次
# 工作区构建中统一 feature，因此 client-core 的桌面单元测试与集成测试都会编译运行。
desktop = ["dep:notify", "dep:globset"]

[lints]
workspace = true
