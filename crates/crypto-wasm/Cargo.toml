[package]
name = "crypto-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "crypto-core 的 wasm-bindgen 绑定，供浏览器 Web Worker 调用"

[lib]
# cdylib 供 wasm-pack 打包，rlib 让测试与原生构建可用。
crate-type = ["cdylib", "rlib"]

[dependencies]
crypto-core = { path = "../crypto-core", version = "0.1.0" }
wasm-bindgen = "0.2"

[lints]
workspace = true
