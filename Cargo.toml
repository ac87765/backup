[workspace]
resolver = "3"
members = [
    "crates/client-core",
    "crates/client-core-desktop-tests",
    "crates/crypto-core",
    "crates/crypto-wasm",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 与 rust-toolchain.toml 固定的工具链保持一致：这是实际测试过的版本，
# 不要在未验证的情况下把 rust-version 报高或报低。
rust-version = "1.98"
publish = false

# 统一 lints：任何 crate 只要写 `[lints] workspace = true` 就继承这里。
# 规则来自 AGENTS.md「硬性规则」：非测试代码禁止 unwrap/expect/panic/todo/unimplemented。
# 测试代码若确实需要，在对应测试模块顶部显式 `#[allow(...)]`（不允许在库代码里全局放宽）。
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# 以下为 clippy 的 restriction 组，默认不启用，必须显式开启。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# 全局开启常用质量 lint；-D warnings 会把这些提升为错误。
all = { level = "warn", priority = -1 }

# 开发/测试构建只保留行号级调试信息：栈回溯仍有文件与行号，但 target/ 体积约减半，
# 链接内存也大幅下降（完整调试信息曾让本地 target/ 涨到 48 GB、让 CI runner 磁盘写满）。
[profile.dev]
debug = "line-tables-only"
