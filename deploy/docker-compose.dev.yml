# 本地开发依赖：PostgreSQL 16 + MinIO（S3 兼容对象存储）。
#
# 用法（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.dev.yml up -d --wait
#   docker compose -f deploy/docker-compose.dev.yml logs -f
#   docker compose -f deploy/docker-compose.dev.yml down -v
#
# 这些账号口令只用于本地开发，禁止用于共享或生产环境。
# 生产环境使用阿里云 OSS / RDS，凭据由环境变量注入（见 design D15）。
#
# 镜像说明（重要）：MinIO 官方镜像已从 Docker Hub 与 quay.io 下架，
# 本地开发改用 Bitnami 的归档镜像（bitnamilegacy/*），只提供 MinIO 服务，
# 不承担任何真实数据。可通过 MINIO_IMAGE / MINIO_CLIENT_IMAGE 指向内部镜像仓库。
name: backup-dev

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16.15-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backup}
      POSTGRES_USER: ${POSTGRES_USER:-backup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backup-dev-password}
    ports:
      # 只绑定回环地址，避免开发数据库暴露到局域网。
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-backup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-backup-dev-secret}
      # 打开 Web 控制台（9001），方便本地排查对象。
      MINIO_BROWSER: "on"
      # 服务器级 CORS 默认值；bucket 级 CORS 由 minio-init 精确设置。
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Bitnami 镜像的数据目录（非 root 用户 1001 写入）。
      - minio-data:/bitnami/minio/data
    healthcheck:
      # 镜像内置 curl，用 MinIO 的存活端点；比 TCP 探测更能反映真实状态。
      test:
        ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 一次性任务：创建私有 bucket 并设置 CORS，保证浏览器可以直传预签名 URL。
  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-bitnamilegacy/minio-client:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-backup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-backup-dev-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-backup}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      # 镜像默认 HOME=/，非 root 用户不可写；mc 需要可写的配置目录。
      HOME: /tmp
    volumes:
      - ./minio/init-bucket.sh:/opt/init/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/opt/init/init-bucket.sh"]
    command: []
    restart: "no"

volumes:
  postgres-data:
  minio-data:
