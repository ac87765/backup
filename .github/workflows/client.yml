name: Client (Flutter / bridge / desktop)

# 与 .github/workflows/ci.yml 一致：功能分支以 impl/ 开头，合并前拿到完整结果。
on:
  push:
    branches: [main, "impl/**"]
    # v* 标签是发布版本：需要带 git describe 的版本号构建安装包。
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只读仓库内容；不使用任何 secrets。
permissions:
  contents: read

concurrency:
  group: client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # client-core 的 dev-dependencies 会编译 server（sqlx 宏）；使用仓库中提交的
  # .sqlx 缓存，CI 不连接数据库。
  SQLX_OFFLINE: "true"
  FLUTTER_VERSION: 3.47.7
  FLUTTER_RUST_BRIDGE_VERSION: 2.13.0

jobs:
  flutter:
    name: Flutter (format / analyze / test / bridge codegen)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 固定 Flutter 版本（design D10）；action 与仓库其它 action 一样固定到 commit SHA。
      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: apps/client
        run: flutter pub get

      # 生成文件（lib/src/rust/**）不参与格式检查：保持生成器原始输出，由下一步
      # 的 codegen + git diff 保证最新。范围与本地验证命令一致。
      - name: dart format --set-exit-if-changed
        working-directory: apps/client
        run: >-
          dart format --set-exit-if-changed
          lib/main.dart lib/app.dart lib/core lib/common lib/desktop test

      - name: flutter analyze
        working-directory: apps/client
        run: flutter analyze

      # golden 需要 Windows 系统字体（Segoe UI Variable / 微软雅黑），在 windows
      # job 用 --tags golden 运行；这里排除，避免 Linux 上因缺字体失败。
      - name: flutter test（排除 golden）
        working-directory: apps/client
        run: flutter test --exclude-tags golden

      - name: 安装 flutter_rust_bridge_codegen 2.13.0
        run: |
          cargo install flutter_rust_bridge_codegen \
            --version "$FLUTTER_RUST_BRIDGE_VERSION" --locked

      # design D2 / tasks 4.1：生成产物必须提交且与源码一致。
      - name: 生成 Dart 绑定并校验无漂移
        working-directory: apps/client
        run: |
          flutter_rust_bridge_codegen generate
          cd ../..
          git diff --exit-code -- apps/client/rust/src/frb_generated.rs apps/client/lib/src/rust

      # 桥接边界测试（DTO 不含字节数组/密钥字段）不需要 Flutter/桌面环境。
      - name: cargo test -p rust_lib_client
        run: cargo test -p rust_lib_client

  # 仓库公开后 Actions 分钟不计费：Windows / macOS 构建在每次推送（含 impl/**）
  # 都运行，合并前就能发现平台专有的编译问题。
  windows:
    name: Windows (client-core tests / release build / installer)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git describe --tags 需要标签；默认浅克隆拿不到。
          fetch-depth: 0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Windows runner 没有 Docker：只运行不依赖 testcontainers 的测试目标（单元测试、
      # 假服务端、退避、测试向量）。真实 PostgreSQL + MinIO 的集成测试由 ci.yml 的 Linux job 运行。
      # 新增不需要 Docker 的测试文件时，把它加到这里的 --test 列表。
      - name: cargo test -p client-core --features desktop（排除 Docker 测试）
        run: >-
          cargo test -p client-core --features desktop
          --lib --test fake_auth --test retry --test transfer_fake --test backup_fake --test vectors

      - name: flutter pub get
        working-directory: apps/client
        run: flutter pub get

      # golden 截图（design/desktop/screenshots 对照）；PNG 由审查者在 Windows
      # 生成后提交，缺失时本步骤会失败，这是预期的验收门槛。
      - name: flutter test（golden）
        working-directory: apps/client
        run: flutter test --tags golden

      - name: 计算版本与提交
        id: version
        shell: pwsh
        run: |
          $version = git describe --tags --always --dirty
          if ($LASTEXITCODE -ne 0) { throw 'git describe 失败' }
          $commit = git rev-parse --short HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse 失败' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

      # 版本号与提交编译进应用（“关于”页），必须与安装包 / 产物名一致。
      - name: flutter build windows --release
        working-directory: apps/client
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          GIT_COMMIT: ${{ steps.version.outputs.commit }}
        run: >-
          flutter build windows --release
          "--dart-define=APP_VERSION=$env:APP_VERSION"
          "--dart-define=GIT_COMMIT=$env:GIT_COMMIT"

      # windows-latest 自带 Inno Setup 6；脚本会依次查 PATH、
      # %LOCALAPPDATA%\Programs\Inno Setup 6 与 %ProgramFiles(x86)%\Inno Setup 6。
      - name: 生成 Inno Setup 安装包
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          GIT_COMMIT: ${{ steps.version.outputs.commit }}
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          ./apps/client/tool/package_windows.ps1 -SkipBuild
          -Version "$env:APP_VERSION" -Commit "$env:GIT_COMMIT"

      # 只上传安装包：Release 目录的全部内容已包含在安装包内，不需要再保留
      # 一份原始目录产物。安装包文件名带版本号，与“关于”页一致。
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-backup-windows
          path: apps/client/build/installer/*.exe
          if-no-files-found: error

  macos:
    name: macOS (client-core tests / release build / dmg)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git describe --tags 需要标签；默认浅克隆拿不到。
          fetch-depth: 0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 同 Windows：macOS runner 没有 Docker，跳过 testcontainers 集成测试。
      - name: cargo test -p client-core --features desktop（排除 Docker 测试）
        run: >-
          cargo test -p client-core --features desktop
          --lib --test fake_auth --test retry --test transfer_fake --test backup_fake --test vectors

      - name: flutter pub get
        working-directory: apps/client
        run: flutter pub get

      # 脚本负责 release 构建、ad-hoc 签名、校验与 dmg 生成（design D10）。
      - name: 构建并打包 macOS .dmg
        run: bash apps/client/tool/package_macos.sh

      # Flutter macOS release 默认只构建运行器架构（macos-latest 为 arm64）。
      # 把实际架构写进日志，便于用户在 Intel / Apple Silicon Mac 上核对。
      - name: 打印应用架构（真机验收核对）
        run: |
          APP="apps/client/build/macos/Build/Products/Release/加密备份.app"
          lipo -archs "$APP/Contents/MacOS/加密备份"

      - name: 上传 macOS .dmg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-backup-macos
          path: apps/client/build/installer/*.dmg
          if-no-files-found: error
