name: CI

on:
  push:
    # 功能分支以 impl/ 开头；推送即跑，便于在合并前拿到完整结果。
    branches: [main, "impl/**"]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只读仓库内容。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# 所有第三方 action 都按 commit SHA 固定（供应链安全），注释保留对应的可读 tag。
# 升级时同时更新 SHA 与注释。
jobs:
  rust:
    name: Rust (fmt / clippy / test / deny / wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # 编译期 SQL 校验使用仓库中提交的 .sqlx 查询缓存；CI 不连接数据库。
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.toml 固定了版本、组件与 wasm32 目标，rustup 会自动安装。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # 4.3：校验 .sqlx/ 与代码中的 sqlx 查询宏保持一致（离线模式，无需数据库）。
      - name: 安装 sqlx-cli 0.8.6
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres --locked

      - name: cargo sqlx prepare --check
        run: cargo sqlx prepare --workspace --check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # 2.10：`aead::seal_with_nonce` 只允许出现在测试向量构建里。
      # 生产（非 cfg(test)、未开 feature）构建中不得包含该符号。
      # 注意：rlib 内的 lib.rmeta 会保留源码中所有条目的名字（包括 cfg 关闭的），
      # 因此只检查真正参与链接的目标文件（*.o）。
      - name: 确认 test-vectors 符号未进入生产构建
        run: |
          cargo build -p crypto-core
          probe="$(mktemp -d)"
          (cd "$probe" && ar x "$GITHUB_WORKSPACE/target/debug/libcrypto_core.rlib")
          if find "$probe" -name '*.o' -exec strings {} + | grep -q 'seal_with_nonce'; then
            echo "error: aead::seal_with_nonce 泄漏到非测试构建" >&2
            exit 1
          fi
          rm -rf "$probe"
          # 下游实现需要时可在 dev-dependencies 中开启该 feature。
          cargo check -p crypto-core --features test-vectors

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

      # 固定 wasm-pack 版本，直接下载官方预编译产物，不用 `curl | sh`。
      - name: 安装 wasm-pack 0.15.0
        run: |
          curl -fsSL -o /tmp/wasm-pack.tar.gz \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version

      # 3.1：浏览器里跑全部测试向量与 KeyStore 契约（含默认 KDF 参数 64 MiB/t=3）。
      - name: wasm-pack test（headless Chrome）
        run: wasm-pack test --headless --chrome --release crates/crypto-wasm

      # --no-opt 跳过 binaryen（wasm-opt）下载：CI 只验证 WASM 与 wasm-bindgen 绑定
      # 能正确产出；带 wasm-opt 的发布构建在镜像构建阶段执行（见 deploy/ 与 9.1）。
      - name: 构建 WASM
        run: wasm-pack build crates/crypto-wasm --target web --release --no-opt

  web:
    name: Web (typecheck / lint / test / build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 前端构建需要先生成 WASM 绑定（typecheck 依赖生成的 .d.ts）。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # 与本地开发使用同一 Node 版本（版本号只在 .nvmrc 维护一份）。
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 wasm-pack 0.15.0
        run: |
          curl -fsSL -o /tmp/wasm-pack.tar.gz \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: 安装依赖
        run: npm ci

      - name: 生成 WASM 绑定
        run: npm run build:wasm

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm run build

  e2e:
    name: E2E (Playwright, strict CSP)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装 wasm-pack 0.15.0
        run: |
          curl -fsSL -o /tmp/wasm-pack.tar.gz \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行 CSP / WASM 冒烟用例
        run: npm run test:e2e

  spec:
    name: OpenSpec (validate --strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # 固定 CLI 版本，避免上游行为变化让规范校验结果漂移。
      - name: 安装 OpenSpec CLI 1.15.0
        run: npm install --global @fission-ai/openspec@1.15.0

      - name: openspec validate --strict
        run: openspec validate bootstrap-e2ee-backup-mvp --strict

  dev-stack:
    name: Dev stack (PostgreSQL + MinIO)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 启动 PostgreSQL 与 MinIO
        run: docker compose -f deploy/docker-compose.dev.yml up -d --wait postgres minio

      - name: 创建 bucket 与 CORS
        run: docker compose -f deploy/docker-compose.dev.yml run --rm --no-deps minio-init

      - name: 输出服务健康状态
        run: docker compose -f deploy/docker-compose.dev.yml ps

      - name: 失败时输出日志
        if: failure()
        run: docker compose -f deploy/docker-compose.dev.yml logs --no-color

      - name: 清理
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v
